<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>Runbot Watcher</title>
</head>
<body>
  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Context card (current tab) -->
  <section id="context-card" class="context-card hidden">
    <div id="context-not-runbot" class="empty-hint hidden">
      <div class="empty-icon">
        <span class="empty-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
      <p>Navigate to a <strong>runbot</strong> page to watch it.</p>
      <p class="hint-sub">Supports bundle, batch &amp; build pages on <a href="https://runbot.odoo.com" id="link-runbot" class="runbot-link" target="_blank" rel="noopener noreferrer"><code>runbot.odoo.com</code></a></p>
    </div>
    <div id="context-detected" class="detected hidden">
      <div class="detected-main">
        <div class="detected-tags">
          <span id="context-badge" class="type-tag"></span>
          <span id="context-fw-badge" class="tag-fw hidden">fw-port</span>
        </div>
        <div id="context-id" class="detected-id"></div>
      </div>
      <div class="detected-actions">
        <button id="btn-add" class="btn btn-primary">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Watch</span>
        </button>
        <div id="watching-state" class="watching-state hidden">
          <span class="watching-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Watching
          </span>
          <button id="btn-remove-context" class="btn-remove-pill" title="Remove from watch list">Remove</button>
        </div>
      </div>
    </div>
  </section>

  <hr class="divider">

  <!-- Watch list -->
  <section class="watch-section">
    <div class="watch-header">
      <div class="watch-header-title">
        <h2>Watch List</h2>
        <span id="watch-count" class="watch-count-badge hidden">0</span>
      </div>
      <button id="btn-poll" class="btn btn-secondary" title="Force a poll now">
        <svg class="poll-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span id="poll-label">Poll now</span>
        <span id="poll-spinner" class="spinner hidden"></span>
      </button>
    </div>

    <!-- API error banner -->
    <div id="api-error" class="api-error hidden">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="api-error-msg">API error</span>
    </div>

    <!-- Empty state -->
    <div id="empty-list" class="empty-list hidden">
      <p>No watches yet.</p>
      <p class="hint-sub">Add bundles, batches or builds to track them.</p>
    </div>

    <!-- Watch items -->
    <ul id="watch-list" class="watch-list"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
