<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
  <title>Runbot Watcher</title>
</head>
<body>
  <header class="topbar">
    <h1>Runbot Watcher</h1>
    <button id="btn-poll" class="icon-btn" title="Check all watches now" aria-label="Check all watches now">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 2.5v3.5H10M2.5 13.5V10H6"/><path d="M12.9 6A5 5 0 0 0 3.4 5.2M3.1 10a5 5 0 0 0 9.5.8"/></svg>
    </button>
  </header>

  <!-- Current tab -->
  <section class="page">
    <p id="context-not-runbot" class="page-hint hidden">
      Open a bundle, batch or build on
      <a href="https://runbot.odoo.com" id="link-runbot">runbot.odoo.com</a>
      to watch it.
    </p>
    <div id="context-detected" class="page-row hidden">
      <div class="page-info">
        <span class="label">This page</span>
        <span id="context-id" class="page-id"></span>
      </div>
      <button id="btn-add" class="btn-primary">Watch</button>
      <div id="watching-state" class="page-watching hidden">
        <span class="watching">Watching</span>
        <button id="btn-remove-context" class="btn-link">Stop</button>
      </div>
    </div>
  </section>

  <!-- Watch list -->
  <section class="watches">
    <div class="section-head">
      <span class="label">Watching</span>
      <span id="watch-count" class="count hidden"></span>
      <span id="last-poll" class="last-poll" title="All watches are checked every minute"></span>
      <span class="head-actions">
        <button id="btn-clear-done" class="btn-link hidden" title="Stop watching everything that has finished">Clear done</button>
        <button id="btn-clear-all" class="btn-link danger hidden" title="Stop watching everything">Clear all</button>
      </span>
    </div>

    <div id="api-error" class="banner hidden" role="status">
      <span id="api-error-msg"></span>
    </div>

    <p id="empty-list" class="empty hidden">Nothing watched yet.</p>

    <ul id="watch-list" class="list"></ul>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-action" class="toast-action hidden">Undo</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
